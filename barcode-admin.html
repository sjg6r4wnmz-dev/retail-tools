<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>条形码台账管理</title>
<style>
:root{--red:#d4382c;--green:#389e0d;--blue:#1677ff;--bg:#f5f6f8;--card:#fff;--txt:#1f2329;--mut:#8a9099;--line:#eceef0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);padding:20px 16px;max-width:840px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:12px;margin:0 0 16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
input,select{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;color:var(--txt)}
input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--blue);color:#fff}
.btn-ghost{background:#eef2f7;color:var(--blue)}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:11px}
th:last-child,td:last-child{text-align:center;width:56px}
td input,td select{border:none;background:transparent;font-size:13px;padding:4px;width:100%}
td input:focus{outline:none;border-bottom:2px solid var(--blue);background:transparent}
td select:focus{outline:none}
td .status-tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600}
.status-auto{background:#eef2f7;color:var(--mut)}
.status-scrap{background:#fff1f0;color:var(--red)}
.status-safe{background:#f6ffed;color:var(--green)}
.empty{text-align:center;padding:40px 0;color:var(--mut);font-size:14px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s}
.toast-ok{background:var(--green);color:#fff}
.toast-err{background:var(--red);color:#fff}
.toast-info{background:var(--blue);color:#fff}
.hidden{display:none!important}
.token-input{display:flex;gap:8px}
.token-input input{flex:1;font-family:monospace;font-size:12px}
.summary{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.summary .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#eef2f7}
.info-box{background:#f0f5ff;border-radius:10px;padding:12px;font-size:12px;color:var(--blue);line-height:1.6;margin-top:10px}
.info-box code{background:rgba(22,119,255,.1);padding:1px 5px;border-radius:4px}
.legend{display:flex;gap:12px;margin-bottom:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:3px}
</style>
</head>
<body>
<h1>📱 条形码台账管理</h1>
<p class="sub">扫码 → 查物料名 → 自动匹配报废/在用清单 · 也可手动强制标记状态</p>

<div class="card">
  <label>🔑 GitHub Token（仅存本机 localStorage）</label>
  <div class="token-input">
    <input id="token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button class="btn btn-ghost btn-sm" onclick="saveToken()">保存</button>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-pri" id="btnLoad" onclick="loadData()">📥 加载台账</button>
  <button class="btn btn-green" id="btnSave" onclick="saveData()" disabled>💾 保存到 GitHub</button>
  <button class="btn btn-ghost" id="btnAdd" onclick="addRow()" disabled>＋ 添加一行</button>
</div>

<div class="summary">
  <span class="chip" id="chipCount">📊 共 0 条</span>
  <span class="chip" id="chipScrap">🔴 强制报废 0</span>
  <span class="chip" id="chipSafe">🟢 强制在用 0</span>
  <span class="chip" id="chipAuto">⚪ 自动判定 0</span>
  <span class="chip" id="chipStatus">🔴 未加载</span>
</div>

<div class="legend">
  <span><span class="status-tag status-scrap">已报废</span> 扫码直接报红</span>
  <span><span class="status-tag status-safe">正常在用</span> 扫码直接报绿</span>
  <span><span class="status-tag status-auto">自动</span> 扫出名称后匹配清单</span>
</div>

<div style="overflow-x:auto">
<table>
<thead><tr><th style="width:150px">条形码</th><th>物料名称</th><th style="width:70px">品牌</th><th style="width:90px">强制状态</th><th>操作</th></tr></thead>
<tbody id="tableBody"><tr><td colspan="5" class="empty">请先点击「加载台账」</td></tr></tbody>
</table>
</div>

<div class="card" style="margin-top:20px">
  <label>📋 批量导入（粘贴多行 CSV，每行：条码,名称,品牌,状态）</label>
  <textarea id="bulkInput" rows="4" style="width:100%;font-size:13px;font-family:monospace;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical" placeholder="格式：barcode,name,brand,status&#10;6901234567890,同心瓶,茶颜,scrap&#10;6901234567891,游园会价签,茶颜,&#10;状态：scrap=报废 safe=在用 留空=自动"></textarea>
  <button class="btn btn-ghost btn-sm" style="margin-top:6px" id="btnBulk" onclick="bulkImport()" disabled>📥 批量导入</button>
</div>

<div class="info-box">
  💡 <b>工作原理</b>：<br>
  ① 拖库扫码 → ② 查台账得到物料名 → <b>如果有强制状态</b>直接返回 → <b>否则</b>用物料名去报废/在用清单匹配<br>
  编辑后点「保存」→ 5 分钟内扫码自动生效，<b>无需手动部署</b>
</div>

<script>
var REPO = 'sjg6r4wnmz-dev/retail-tools';
var CSV_PATH = 'barcode_map.csv';
var MJS_PATH = 'barcode_map.mjs';
var API = 'https://api.github.com/repos/' + REPO + '/contents/';
var rows = [];
var csvSha = null;
var mjsSha = null;
var loaded = false;

/* ============ Token ============ */
function getToken(){ return document.getElementById('token').value.trim() || localStorage.getItem('barcode_token') || ''; }
function saveToken(){ var t = document.getElementById('token').value.trim(); if(t){ localStorage.setItem('barcode_token', t); toast('Token 已保存','ok'); } }
(function(){ var t = localStorage.getItem('barcode_token'); if(t) document.getElementById('token').value = t; })();

/* ============ Toast ============ */
function toast(msg, type){
  var el = document.createElement('div');
  el.className = 'toast toast-' + (type||'info');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 300); }, 2500);
}

/* ============ GitHub API ============ */
async function gh(method, path, body){
  var token = getToken();
  if(!token) throw new Error('请先输入 GitHub Token');
  var opts = { method: method, headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.v3+json', 'User-Agent': 'BarcodeAdmin' } };
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var res = await fetch(API + path, opts);
  var data = await res.json();
  if(!res.ok) throw new Error(data.message || 'HTTP ' + res.status);
  return data;
}

/* ============ 加载数据 ============ */
async function loadData(){
  var btn = document.getElementById('btnLoad');
  btn.disabled = true; btn.textContent = '加载中…';
  try{
    var csvData = await gh('GET', CSV_PATH);
    csvSha = csvData.sha;
    var csvText = atob(csvData.content.replace(/\n/g,''));
    rows = [];
    var lines = csvText.split(/\r?\n/);
    for(var i=0; i<lines.length; i++){
      var line = lines[i].trim();
      if(!line || i===0) continue;
      var parts = []; var inQuote = false, buf = '';
      for(var j=0; j<line.length; j++){
        var ch = line[j];
        if(ch==='"'){ inQuote = !inQuote; }
        else if(ch===',' && !inQuote){ parts.push(buf); buf = ''; }
        else { buf += ch; }
      }
      parts.push(buf);
      if(parts.length>=2 && parts[0].trim()){
        var status = (parts[3]||'').trim().toLowerCase();
        if(status!=='scrap' && status!=='safe') status = '';
        rows.push({ barcode: parts[0].trim(), name: parts[1].trim(), brand: (parts[2]||'').trim(), status: status });
      }
    }

    try{ var mjsData = await gh('GET', MJS_PATH); mjsSha = mjsData.sha; } catch(e){ mjsSha = null; }

    loaded = true;
    renderTable();
    updateSummary();
    document.getElementById('btnSave').disabled = false;
    document.getElementById('btnAdd').disabled = false;
    document.getElementById('btnBulk').disabled = false;
    toast('加载成功：' + rows.length + ' 条', 'ok');
  }catch(e){
    toast('加载失败：' + e.message, 'err');
  }finally{
    btn.disabled = false; btn.textContent = '📥 加载台账';
  }
}

/* ============ 渲染表格 ============ */
function renderTable(){
  var tbody = document.getElementById('tableBody');
  if(rows.length===0){ tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无数据，点击「添加一行」或「批量导入」</td></tr>'; return; }
  var html = '';
  for(var i=0; i<rows.length; i++){
    var r = rows[i];
    var statusLabel = r.status === 'scrap' ? '已报废' : r.status === 'safe' ? '正常在用' : '自动';
    var statusCls = r.status === 'scrap' ? 'scrap' : r.status === 'safe' ? 'safe' : 'auto';
    html += '<tr>'
      + '<td><input value="' + esc(r.barcode) + '" data-idx="' + i + '" data-field="barcode" onchange="onCellChange(this)"></td>'
      + '<td><input value="' + esc(r.name) + '" data-idx="' + i + '" data-field="name" onchange="onCellChange(this)"></td>'
      + '<td><input value="' + esc(r.brand||'') + '" data-idx="' + i + '" data-field="brand" onchange="onCellChange(this)" placeholder="茶颜"></td>'
      + '<td><select data-idx="' + i + '" data-field="status" onchange="onStatusChange(this)">'
      + '<option value=""' + (r.status===''?' selected':'') + '>自动</option>'
      + '<option value="scrap"' + (r.status==='scrap'?' selected':'') + '>已报废</option>'
      + '<option value="safe"' + (r.status==='safe'?' selected':'') + '>正常在用</option>'
      + '</select></td>'
      + '<td><button class="btn btn-red btn-sm" onclick="deleteRow(' + i + ')">删除</button></td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

function onStatusChange(el){
  var i = parseInt(el.dataset.idx);
  if(rows[i]) rows[i].status = el.value;
  updateSummary();
}

function onCellChange(el){
  var i = parseInt(el.dataset.idx);
  var field = el.dataset.field;
  if(rows[i]) rows[i][field] = el.value.trim();
}

function deleteRow(i){
  if(!confirm('确定删除「' + (rows[i].name||rows[i].barcode) + '」？')) return;
  rows.splice(i,1);
  renderTable();
  updateSummary();
}

function addRow(){
  rows.push({ barcode:'', name:'', brand:'茶颜', status:'' });
  renderTable();
}

function updateSummary(){
  var scrap = 0, safe = 0, auto = 0;
  rows.forEach(function(r){ if(r.status==='scrap') scrap++; else if(r.status==='safe') safe++; else auto++; });
  document.getElementById('chipCount').textContent = '📊 共 ' + rows.length + ' 条';
  document.getElementById('chipScrap').textContent = '🔴 强制报废 ' + scrap;
  document.getElementById('chipSafe').textContent = '🟢 强制在用 ' + safe;
  document.getElementById('chipAuto').textContent = '⚪ 自动判定 ' + auto;
  document.getElementById('chipStatus').textContent = loaded ? '🟢 已加载（未保存）' : '🔴 未加载';
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============ 保存 ============ */
async function saveData(){
  var btn = document.getElementById('btnSave');
  if(!confirm('确定保存 ' + rows.length + ' 条条形码到 GitHub？')) return;
  btn.disabled = true; btn.textContent = '保存中…';
  try{
    // 生成 CSV（含状态列）
    var csvLines = ['barcode,name,brand,status'];
    for(var i=0; i<rows.length; i++){
      var r = rows[i];
      csvLines.push([r.barcode, r.name, r.brand||'', r.status||''].join(','));
    }
    var csvContent = '\ufeff' + csvLines.join('\n');

    // 生成 .mjs（含 MAP + STATUS）
    var mjsContent = generateMjs();

    // 上传 CSV
    var csvBody = { message: 'update barcode_map.csv (' + rows.length + ' entries)', content: btoa(unescape(encodeURIComponent(csvContent))), branch: 'main' };
    if(csvSha) csvBody.sha = csvSha;
    var csvRes = await gh('PUT', CSV_PATH, csvBody);
    csvSha = csvRes.content.sha;

    // 上传 .mjs
    var mjsBody = { message: 'update barcode_map.mjs (' + rows.length + ' entries)', content: btoa(unescape(encodeURIComponent(mjsContent))), branch: 'main' };
    if(mjsSha) mjsBody.sha = mjsSha;
    var mjsRes = await gh('PUT', MJS_PATH, mjsBody);
    mjsSha = mjsRes.content.sha;

    loaded = true;
    updateSummary();
    document.getElementById('chipStatus').textContent = '🟢 已保存 · 5分钟内扫码生效';
    toast('保存成功！', 'ok');
  }catch(e){
    toast('保存失败：' + e.message, 'err');
  }finally{
    btn.disabled = false; btn.textContent = '💾 保存到 GitHub';
  }
}

function generateMjs(){
  var now = new Date().toISOString().replace('T',' ').substring(0,19);
  var lines = [
    '// 条形码 → 行销物名称 映射表',
    '// 自动生成于 ' + now,
    '// 共 ' + rows.length + ' 条记录',
    '',
    'const MAP = {',
  ];
  for(var i=0; i<rows.length; i++){
    var r = rows[i];
    lines.push('  "' + r.barcode.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '": "' + r.name.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '",');
  }
  lines.push('};');
  lines.push('');

  // STATUS: forced status
  var forced = rows.filter(function(r){ return r.status === 'scrap' || r.status === 'safe'; });
  if(forced.length > 0){
    lines.push('// 强制状态（scrap=已报废, safe=正常在用）');
    lines.push('const STATUS = {');
    forced.forEach(function(r){
      lines.push('  "' + r.barcode.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '": "' + r.status + '",');
    });
    lines.push('};');
  } else {
    lines.push('const STATUS = {};');
  }

  lines.push('');
  lines.push('// CSV fallback loader');
  lines.push('try { const fs = require("fs"); const path = require("path");');
  lines.push('  const csvPath = path.join(__dirname, "barcode_map.csv");');
  lines.push('  if (fs.existsSync(csvPath)) {');
  lines.push('    const csv = fs.readFileSync(csvPath, "utf-8");');
  lines.push('    const csvLines = csv.split(/\\r?\\n/);');
  lines.push('    for (let i = 1; i < csvLines.length; i++) {');
  lines.push('      const line = csvLines[i].trim(); if (!line) continue;');
  lines.push('      const parts = line.split(",");');
  lines.push('      if (parts.length >= 2) {');
  lines.push('        const bc = parts[0].trim(), nm = parts[1].trim();');
  lines.push('        if (bc && nm && !MAP[bc]) { MAP[bc] = nm;');
  lines.push('          const st = (parts[3]||"").trim();');
  lines.push('          if (st === "scrap" || st === "safe") STATUS[bc] = st;');
  lines.push('        }');
  lines.push('      }');
  lines.push('    }');
  lines.push('  }');
  lines.push('} catch(e) {}');
  lines.push('');
  lines.push('module.exports = MAP;');
  lines.push('exports.STATUS = STATUS;');

  return lines.join('\n') + '\n';
}

/* ============ 批量导入 ============ */
function bulkImport(){
  var text = document.getElementById('bulkInput').value.trim();
  if(!text) return;
  var lines = text.split(/\r?\n/);
  var added = 0;
  for(var i=0; i<lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;
    var parts = line.split(',');
    if(parts.length>=2 && parts[0].trim()){
      var s = (parts[3]||'').trim().toLowerCase();
      if(s!=='scrap' && s!=='safe') s = '';
      rows.push({ barcode: parts[0].trim(), name: parts[1].trim(), brand: (parts[2]||'').trim(), status: s });
      added++;
    }
  }
  renderTable();
  updateSummary();
  document.getElementById('bulkInput').value = '';
  toast('已导入 ' + added + ' 条', 'ok');
}
</script>
</body>
</html>
