<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>零售工具入口 · 茶颜悦色</title>
  <style>
    :root {
      --primary: #C8161D; --primary-dark: #A01016; --primary-light: #FFF5F5;
      --bg: #F5F5F7; --card: #FFFFFF; --text: #1A1A1A; --text-2: #86868B; --text-3: #AEAEB2;
      --border: #E5E5EA; --safe: #34C759; --warn: #FF9500; --danger: #FF3B30; --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .container { max-width: 500px; margin: 0 auto; padding: 0 20px 40px; }
    .header { text-align: center; padding: 36px 0 28px; }
    .header .logo { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); margin-bottom: 16px; box-shadow: 0 8px 24px rgba(200,22,29,0.22); }
    .header .logo svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .header .sub { font-size: 14px; color: var(--text-2); margin-top: 8px; }
    .tool-card { display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: all 0.15s; border: 1.5px solid transparent; text-decoration: none; color: inherit; }
    .tool-card:active { transform: scale(0.985); }
    .tool-card:hover { border-color: rgba(200,22,29,0.15); }
    .tool-icon { flex-shrink: 0; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .tool-icon.posm { background: #E3F2FD; color: #1565C0; }
    .tool-icon.rectify { background: var(--primary-light); color: var(--primary); }
    .tool-icon.tea { background: #E8F5E9; color: #2E7D32; }
    .tool-icon svg { width: 30px; height: 30px; }
    .tool-info { flex: 1; min-width: 0; }
    .tool-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .tool-desc { font-size: 13px; color: var(--text-2); line-height: 1.5; }
    .tool-arrow { flex-shrink: 0; color: var(--text-3); }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 8px 0 14px 4px; }
    .footer { text-align: center; padding-top: 20px; }
    .footer p { font-size: 12px; color: var(--text-3); }
    .badge-new { display: inline-block; font-size: 10px; font-weight: 600; color: #fff; background: var(--primary); padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/></svg>
      </div>
      <h1>零售工具入口</h1>
      <p class="sub">选择你要使用的工具</p>
    </div>

    <div class="section-title">常用工具</div>

    <a class="tool-card" href="https://sjg6r4wnmz-dev.github.io/retail-tools/posm-recog.html">
      <div class="tool-icon posm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <div class="tool-info">
        <div class="tool-title">行销物报废识别<span class="badge-new">拍照识别</span></div>
        <div class="tool-desc">拍摄门店行销物，自动识别是否为报废清单或在用清单中的物料，快速核对。</div>
      </div>
      <div class="tool-arrow">&#9654;</div>
    </a>

    <a class="tool-card" href="https://sjg6r4wnmz-dev.github.io/retail-tools/rectify.html">
      <div class="tool-icon rectify">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>
      </div>
      <div class="tool-info">
        <div class="tool-title">稽核整改闭环</div>
        <div class="tool-desc">查看零售/运营稽核扣分点，逐条整改、签名确认并一次性提交全部信息。</div>
      </div>
      <div class="tool-arrow">&#9654;</div>
    </a>

    <a class="tool-card" href="store-audit-query/index.html">
      <div class="tool-icon" style="background:#EDE7F6;color:#5E35B1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="tool-info">
        <div class="tool-title">门店稽核查询工具</div>
        <div class="tool-desc">按门店查询稽核结果与扣分明细，快速核对整改项。</div>
      </div>
      <div class="tool-arrow">&#9654;</div>
    </a>

    <a class="tool-card" href="https://alidocs.dingtalk.com/notable/share/form/v011X3lE5w1YGMJGlJb_CuQb0gT_pM3Ct9j?source=link" target="_blank" rel="noopener">
      <div class="tool-icon tea">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      </div>
      <div class="tool-info">
        <div class="tool-title">茶叶电子台账收集</div>
        <div class="tool-desc">门店茶叶试闻记录收集表单（钉钉表单，提交后自动汇总）。</div>
      </div>
      <div class="tool-arrow">&#9654;</div>
    </a>

    <div class="section-title" style="margin-top:8px">管理后台</div>

    <a class="tool-card" href="admin.html?v=3">
      <div class="tool-icon" style="background:#FFF3E0;color:#EF6C00;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      </div>
      <div class="tool-info">
        <div class="tool-title">整改管理后台</div>
        <div class="tool-desc">查看、编辑、删除已提交的整改记录（需密码）。</div>
      </div>
      <div class="tool-arrow">&#9654;</div>
    </a>

        <a class="tool-card" href="https://alidocs.dingtalk.com/notable/query/view/v011X3lE5w1YGMJGlJb_CuQb0gT_yQbeWkl?dd_darkmode=true&amp;dd_full_screen=true" target="_blank" rel="noopener">
      <div class="tool-icon" style="background:#E8F5E9;color:#2E7D32;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <div class="tool-info">
        <div class="tool-title">茶叶台账查询</div>
        <div class="tool-desc">查看门店已提交的茶叶试闻记录（钉钉台账，数据实时汇总）。</div>
      </div>
      <div class="tool-arrow">&#9654;</div>
    </a>

<div class="footer">
      <p>运营部零售组 · 维护：kon</p>
    </div>
  </div>
</body>
</html>
