<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>茶叶试闻电子台账</title>
<style>
  :root{
    --tea-green:#2f6b4f;
    --tea-green-light:#e8f1ec;
    --tea-gold:#c9a86a;
    --bg:#f5f3ee;
    --card:#ffffff;
    --text:#2b2b2b;
    --muted:#8a8a8a;
    --line:#e3e0d8;
    --danger:#c0392b;
    --warn:#e67e22;
    --warn-bg:#fef3e8;
    --expired:#c0392b;
    --expired-bg:#fdeaea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
  }
  header{
    background:linear-gradient(135deg,var(--tea-green),#3c8163);
    color:#fff;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.5px;}
  header p{margin:4px 0 0;font-size:13px;opacity:.85;}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  /* Tab 导航 */
  .tab-nav{
    display:flex;gap:8px;background:var(--card);padding:8px;border-radius:12px;
    border:1px solid var(--line);margin-bottom:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);position:sticky;top:8px;z-index:20;
  }
  .tab-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 16px;border:none;background:transparent;border-radius:8px;
    font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;
    font-family:inherit;transition:all .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .tab-btn .tab-icon{font-size:18px;}
  .tab-btn:hover{background:var(--tea-green-light);color:var(--tea-green);}
  .tab-btn.active{
    background:var(--tea-green);color:#fff;box-shadow:0 2px 6px rgba(47,107,79,.3);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .card h2{margin:0 0 16px;font-size:16px;color:var(--tea-green);
    display:flex;align-items:center;gap:8px;}
  .card h2::before{content:"";width:4px;height:16px;background:var(--tea-green);border-radius:2px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:13px;color:var(--muted);}
  label .req{color:var(--danger);margin-left:2px;}
  input,select,textarea{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;
    background:#fcfcfb;color:var(--text);font-family:inherit;transition:border .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tea-green);background:#fff;}
  textarea{resize:vertical;min-height:60px;}
  .btn{
    border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;
    font-family:inherit;transition:opacity .15s,transform .05s;font-weight:500;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--tea-green);color:#fff;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:var(--tea-green-light);color:var(--tea-green);}
  .btn-ghost:hover{opacity:.85;}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--text);}
  .btn-line:hover{background:#fafafa;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    background:#333;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;
  }
  .toast.show{opacity:1;}
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--tea-green);}
  .count-bar{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .count-bar b{color:var(--tea-green);}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:var(--tea-green-light);color:var(--tea-green);font-weight:600;position:sticky;top:0;}
  tbody tr:hover{background:#fafaf8;}
  .status-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eee;color:#555;}
  .warn-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--warn-bg);color:var(--warn);font-weight:500;}
  .expired-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--expired-bg);color:var(--expired);font-weight:500;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .query-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .query-row .field{min-width:150px;}
  /* 可搜索下拉 */
  .combo{position:relative;}
  .combo-list{
    position:absolute;top:100%;left:0;right:0;z-index:50;
    background:#fff;border:1px solid var(--line);border-top:none;
    border-radius:0 0 8px 8px;max-height:240px;overflow-y:auto;
    list-style:none;margin:0;padding:4px 0;box-shadow:0 6px 16px rgba(0,0,0,.12);
    display:none;
  }
  .combo-list li{
    padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;
    gap:10px;align-items:center;font-size:14px;
  }
  .combo-list li:hover{background:var(--tea-green-light);}
  .combo-name{color:var(--text);}
  .combo-hint{color:var(--muted);font-size:12px;white-space:nowrap;}
  .combo-empty{padding:8px 12px;color:var(--muted);font-size:13px;cursor:default;}
  /* 多茶叶条目列表 */
  .item-group{
    margin-top:6px;border:1px dashed var(--line);border-radius:10px;
    padding:10px 12px;background:#fbfaf6;
  }
  .item-group-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:8px;font-size:13px;color:var(--tea-green);font-weight:500;
  }
  .item-group-head .count-tag{
    background:var(--tea-green-light);padding:2px 8px;border-radius:10px;
    font-size:12px;color:var(--tea-green);
  }
  .item-row{
    display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;
    flex-wrap:wrap;
  }
  .item-row:last-child{margin-bottom:0;}
  .item-idx{
    flex:0 0 24px;height:32px;line-height:32px;text-align:center;
    background:var(--tea-green);color:#fff;border-radius:50%;
    font-size:12px;font-weight:600;margin-top:4px;
  }
  .item-row .tea-input{flex:1;min-width:200px;}
  .item-row .tea-input input{width:100%;}
  .item-del{
    flex:0 0 32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--muted);cursor:pointer;font-size:18px;
    line-height:1;display:flex;align-items:center;justify-content:center;
    margin-top:4px;
  }
  .item-del:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
  .item-add{
    width:100%;margin-top:4px;padding:9px;border:1px dashed var(--line);
    border-radius:8px;background:transparent;color:var(--tea-green);
    cursor:pointer;font-size:13px;font-family:inherit;
    transition:background .15s,border-color .15s;
  }
  .item-add:hover{background:var(--tea-green-light);border-color:var(--tea-green);}
  /* ---- 删除记录 ---- */
  .btn-del{
    border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;
    background:var(--danger);color:#fff;font-family:inherit;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .btn-del:hover{opacity:.88;}
  .td-del{text-align:center;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{opacity:.92;}
  .modal-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:14px;width:100%;max-width:360px;padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);animation:fadeIn .18s ease;
  }
  .modal-title{font-size:16px;font-weight:600;color:var(--danger);margin-bottom:12px;}
  .modal-detail{font-size:13px;line-height:1.9;color:var(--text);}
  .modal-detail .md-label{display:inline-block;width:62px;color:var(--muted);}
  .modal-warn{
    margin-top:10px;font-size:12px;color:var(--warn);background:var(--warn-bg);
    padding:8px 10px;border-radius:8px;line-height:1.5;
  }
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;padding:10px;font-size:14px;}
  @media(max-width:640px){
    .btn-del{padding:6px 12px;font-size:12px;}
    .modal-box{padding:16px;}
  }
  /* ---- 查询结果：移动端卡片式布局 ---- */
  .result-cards{display:none;}
  @media(max-width:640px){
    .table-scroll{display:none;}
    .result-cards{display:block;}
    .result-card{
      background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);
    }
    .result-card .rc-head{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line);
    }
    .result-card .rc-tea{font-size:15px;font-weight:600;color:var(--tea-green);}
    .result-card .rc-date{font-size:12px;color:var(--muted);}
    .result-card .rc-row{
      display:flex;gap:8px;margin-bottom:4px;font-size:13px;line-height:1.6;
    }
    .result-card .rc-label{flex:0 0 56px;color:var(--muted);font-size:12px;}
    .result-card .rc-value{flex:1;color:var(--text);}
    .result-card .rc-meta{
      margin-top:6px;font-size:11px;color:var(--muted);
      display:flex;justify-content:space-between;
    }
    .result-card .rc-warn{margin-bottom:6px;}
    .empty-card{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;}

    /* 门店分组折叠卡片 */
    .store-card{
      background:var(--card);border:1px solid var(--line);border-radius:12px;
      margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;
    }
    .store-header{
      display:flex;align-items:center;gap:10px;padding:14px 16px;
      cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
      user-select:none;background:linear-gradient(135deg,#f8faf7 0%,#fff 100%);
    }
    .store-header:active{background:#f0f4ee;}
    .store-header .store-icon{
      width:36px;height:36px;border-radius:10px;
      background:var(--tea-green);color:#fff;font-size:16px;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .store-header .store-info{flex:1;min-width:0;}
    .store-header .store-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .store-header .store-meta{font-size:12px;color:var(--muted);margin-top:2px;}
    .store-header .store-arrow{
      width:24px;height:24px;display:flex;align-items:center;justify-content:center;
      color:var(--muted);transition:transform .2s ease;font-size:14px;
    }
    .store-card.collapsed .store-arrow{transform:rotate(-90deg);}
    .tea-list{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;}
    .store-card.collapsed .tea-list{display:none;}
    .tea-item{
      background:#fafbfa;border:1px solid var(--line);border-radius:10px;
      padding:12px 14px;position:relative;
    }
    .tea-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .tea-item-name{font-size:14px;font-weight:600;color:var(--tea-green);}
    .tea-item-date{font-size:12px;color:var(--muted);}
    .tea-item-row{display:flex;gap:6px;margin-bottom:3px;font-size:12px;line-height:1.5;}
    .tea-item-label{flex:0 0 48px;color:var(--muted);}
    .tea-item-val{flex:1;color:var(--text);word-break:break-all;}
    .tea-item-meta{margin-top:6px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}
    .store-divider{height:1px;background:var(--line);margin:0 16px;}
    .store-card.collapsed .store-divider{display:none;}

    /* 表单单列 */
    .grid{grid-template-columns:1fr;}
    .query-row{flex-direction:column;}
    .query-row .field{min-width:100%;}
    .query-row .field[style*="flex-direction:row"]{flex-wrap:wrap;}
    .query-row .field[style*="flex-direction:row"] button{flex:1;min-width:80px;}

    /* 增大触控目标 */
    input,select,textarea,button{padding:12px 14px;font-size:16px;}
    .btn{padding:12px 18px;font-size:16px;}
    .item-row .tea-input input{padding:12px 14px;font-size:16px;}
    .item-del{width:40px;height:40px;font-size:20px;}
    .item-idx{width:28px;height:36px;line-height:36px;font-size:13px;}
    .item-add{padding:12px;font-size:15px;}
    .combo-list li{padding:12px 14px;font-size:16px;}

    /* 减小间距 */
    header{padding:14px 16px;}
    header h1{font-size:18px;}
    .wrap{padding:12px 10px 80px;}
    .card{padding:14px;margin-bottom:12px;border-radius:10px;}
    .grid{gap:10px;}

    /* Toast 安全区 */
    .toast{top:env(safe-area-inset-top,12px);}
  }

  @media(min-width:481px) and (max-width:720px){
    .grid{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:480px){.grid{grid-template-columns:1fr;}}
</style>

<body>
<header>
  <h1>🍵 茶叶试闻电子台账</h1>
  <p>门店登记 · 统一查询 · 多门店数据实时汇总</p>
</header>

<div class="wrap">

  <!-- Tab 切换 -->
  <div class="tab-nav">
    <button class="tab-btn active" data-tab="record" onclick="switchTab('record')">
      <span class="tab-icon">📝</span><span>登记试闻</span>
    </button>
    <button class="tab-btn" data-tab="query" onclick="switchTab('query')">
      <span class="tab-icon">🔍</span><span>查询台账</span>
    </button>
    <a class="tab-btn" href="records.html" style="text-decoration:none;">
      <span class="tab-icon">📋</span><span>记录查看</span>
    </a>
  </div>

  <!-- 登记试闻 -->
  <div class="tab-panel active" id="panel-record">
    <div class="card">
      <h2>登记试闻记录 <span style="font-size:12px;color:var(--muted);font-weight:400;">（可同时登记多条茶叶）</span></h2>
      <form id="form">
      <!-- 基本信息（共享字段） -->
      <div class="grid">
        <div class="field">
          <label>门店<span class="req">*</span></label>
          <div class="combo">
            <input id="f_store" placeholder="搜索或输入门店名称（必填）" required autocomplete="off">
            <ul class="combo-list" id="list_store"></ul>
          </div>
        </div>
        <div class="field">
          <label>登记日期<span class="req">*</span></label>
          <input id="f_date" type="date" required>
        </div>
        <div class="field">
          <label>登记人</label>
          <div class="combo">
            <input id="f_taster" placeholder="从钉钉组织架构中选择（选填）" autocomplete="off">
            <ul class="combo-list" id="list_taster"></ul>
          </div>
        </div>
      </div>

      <!-- 茶叶条目列表 -->
      <div class="item-group" style="margin-top:18px;">
        <div class="item-group-head">
          <span>茶叶条目</span>
          <span class="count-tag" id="itemCountTag">已添加 1 种</span>
        </div>
        <div id="itemList"></div>
        <button type="button" class="item-add" onclick="addItem()">＋ 添加茶叶</button>
      </div>

      <div class="actions" style="margin-top:18px;">
        <button type="submit" class="btn btn-primary">提交登记</button>
        <button type="reset" class="btn btn-line" onclick="onFormReset()">清空</button>
      </div>
    </form>
    </div>
  </div>

  <!-- 查询台账 -->
  <div class="tab-panel" id="panel-query">
    <div class="card">
      <h2>查询台账</h2>
      <div class="query-row">
      <div class="field" style="flex:1;min-width:280px;">
        <label>门店名称</label>
        <input id="q_store" placeholder="输入门店名称，查询该门店所有记录（留空查看全部）">
      </div>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px;">
        <button class="btn btn-primary" onclick="doQuery()">查询</button>
        <button class="btn btn-line" onclick="resetQuery()">重置</button>
        <button class="btn btn-ghost" onclick="exportCsv()">导出 Excel</button>
        <button class="btn btn-ghost" id="btnSyncLocal" onclick="manualSyncLocal()" style="display:none;color:var(--warn);">同步本地记录</button>
      </div>
    </div>

    <div class="count-bar" id="countBar" style="display:none;"></div>
    <!-- 桌面端：表格 -->
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>门店</th><th>登记日期</th><th>茶叶名称</th>
            <th>登记人</th><th>预警状态</th><th>录入时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" class="empty">暂无数据，点击「查询」加载，或先登记一条记录。</td></tr>
        </tbody>
      </table>
    </div>
    <!-- 移动端：卡片式 -->
    <div class="result-cards" id="resultCards">
      <div class="empty-card">暂无数据，点击「查询」加载，或先登记一条记录。</div>
    </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 删除确认弹窗 -->
<div class="modal-mask" id="modalMask" style="display:none;" onclick="if(event.target===this)closeDeleteModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">⚠️ 确认删除这条记录？</div>
    <div class="modal-detail">
      <div><span class="md-label">门店</span><span id="delStore"></span></div>
      <div><span class="md-label">日期</span><span id="delDate"></span></div>
      <div><span class="md-label">茶叶</span><span id="delTea"></span></div>
      <div><span class="md-label">登记人</span><span id="delTaster"></span></div>
      <div><span class="md-label">录入时间</span><span id="delTime"></span></div>
    </div>
    <div class="modal-warn" id="delHint">云端记录删除后约 1-2 分钟生效，且不可恢复。</div>
    <div class="modal-actions">
      <button class="btn btn-line" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDeleteRecord()">确认删除</button>
    </div>
  </div>
</div>

<!-- AUTO_DATA_START -->
<script>
// 茶叶试闻台账云端数据（自动生成于 2026-08-14 05:57:16）

<script>
// Tab 切换
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + name);
  });
  // 切到查询台账时，自动加载一次数据（如果之前没加载过）
  if(name === 'query'){
    // 重试未提交的删除请求 + 清理已删除标记
    retryDeletes();
    cleanupDeletedIds();
    // 先尝试同步本地未上传记录
    syncLocalRecords().then(res => {
      if(res.uploaded > 0){
        toast(`已补传 ${res.uploaded} 条本地记录到云端`, 'ok');
      }
      doQuery();
    });
    if(!window._queryLoaded) window._queryLoaded = true;
  }
  // 滚到顶部
  window.scrollTo({top: 0, behavior: 'smooth'});
}

const $ = id => document.getElementById(id);

// ====== localStorage 数据层 + 云端钉钉AI表格同步 ======
const LS_KEY = 'tea_ledger_records';
const TUNNEL_URL = 'https://posm-recog-posm-scap-recog-oopugfimug.cn-hangzhou.fcapp.run';
const AUTH_TOKEN = 'posm_5fa4761ff06d7c89d189faf93574f248';
let _nextId = 0;

function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch(e){ return []; }
}

function saveRecords(records){
  try{
    // 只保留最近 90 天的本地记录，防止 localStorage 无限增长
    const cutoff = new Date(Date.now() - 90*24*3600*1000).toISOString().slice(0,10);
    const cleaned = records.filter(r => !r.register_date || r.register_date >= cutoff);
    localStorage.setItem(LS_KEY, JSON.stringify(cleaned));
  }
  catch(e){ toast('存储空间不足，请清理旧记录', 'err'); throw e; }
}

function getNextId(records){
  if(!_nextId) _nextId = records.reduce((max, r) => Math.max(max, r.id||0), 0);
  return ++_nextId;
}

async function insertRecords(baseData, teaItems){
  const now = new Date().toISOString().replace('T',' ').slice(0,19);
  const payload = {
    store: baseData.store,
    register_date: baseData.register_date,
    tea_names: teaItems.map(it => it.tea_name.trim()).filter(Boolean),
    tea_items: teaItems.map(it => ({tea_name: it.tea_name.trim()})).filter(it => it.tea_name),
    taster: baseData.taster,
    created_at: now
  };

  let cloudOk = false;
  try {
    const resp = await fetch(TUNNEL_URL + '/teatest/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Auth-Token': AUTH_TOKEN},
      body: JSON.stringify(payload)
    });
    cloudOk = resp.ok;
  } catch(e) {}

  // 无论云端是否成功，都写入本机 localStorage：
  // 1) 录入后立即可在查询页看到自己的记录
  // 2) 云端暂存有 10 分钟 TTL，若同步服务临时中断可防数据丢失
  // 3) 云端数据同步到位后（同 key）会覆盖本机记录，不影响去重
  const records = loadRecords();
  const newRecords = teaItems.map(it => {
    const id = getNextId(records);
    return { id, store: baseData.store, register_date: baseData.register_date,
      tea_name: it.tea_name, taster: baseData.taster,
      created_at: now, pending: !cloudOk, source: 'local' };
  });
  records.push(...newRecords);
  saveRecords(records);
  return { records: newRecords, cloudOk };
}

// 重试上传本地未同步记录
async function syncLocalRecords(){
  const records = loadRecords().filter(r => r.pending);
  if(!records.length) return { uploaded: 0, failed: 0 };

  // 按 (store, register_date, taster) 分组，减少请求次数
  const groups = {};
  records.forEach(r => {
    const key = (r.store||'') + '||' + (r.register_date||'') + '||' + (r.taster||'');
    if(!groups[key]) groups[key] = { store: r.store, register_date: r.register_date, taster: r.taster, created_at: r.created_at, items: [] };
    groups[key].items.push({ tea_name: r.tea_name });
  });

  let uploaded = 0, failed = 0;
  for(const g of Object.values(groups)){
    try {
      const resp = await fetch(TUNNEL_URL + '/teatest/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Auth-Token': AUTH_TOKEN},
        body: JSON.stringify({
          store: g.store,
          register_date: g.register_date,
          tea_names: g.items.map(it => it.tea_name.trim()).filter(Boolean),
          tea_items: g.items.map(it => ({tea_name: it.tea_name.trim()})).filter(it => it.tea_name),
          taster: g.taster,
          created_at: g.created_at
        })
      });
      if(resp.ok){
        uploaded += g.items.length;
      } else {
        failed += g.items.length;
      }
    } catch(e) {
      failed += g.items.length;
    }
  }

  // 上传成功的从本地移除
  if(uploaded > 0){
    const remaining = loadRecords().filter(r => {
      if(!r.pending) return true;
      return !Object.values(groups).some(g =>
        g.store === r.store && g.register_date === r.register_date && g.taster === r.taster
      );
    });
    saveRecords(remaining);
  }

  return { uploaded, failed };
}

function queryRecords(storeFilter){
  // 1. 本地 localStorage 记录
  const localRecords = loadRecords();

  // 2. 云端钉钉 AI 表格记录（由 teatest_data.js 注入 window.TEATEST_CLOUD_DATA）
  let cloudRecords = [];
  if(window.TEATEST_CLOUD_DATA && Array.isArray(window.TEATEST_CLOUD_DATA)){
    // 过滤掉本机已提交删除请求、但云端尚未同步删除的记录（避免"删了又冒出来"）
    const delIds = loadDeletedIds();
    cloudRecords = window.TEATEST_CLOUD_DATA
      .filter(r => !delIds.has(r.recordId))
      .map(r => ({
      id: 0,
      recordId: r.recordId || '',
      store: r.store || '',
      register_date: r.register_date || '',
      tea_name: r.tea_name || '',
      taster: r.taster || '',
      created_at: r.created_at || '',
      source: 'cloud'
    }));
  }

  // 3. 合并：以 (store, register_date, tea_name) 为 key，云端数据优先
  //    注意 key 必须含日期：同一门店同一种茶叶在不同日期的登记是不同的记录，
  //    若只按 (store, tea_name) 去重会丢失历史记录，导致“查不到”
  const allMap = new Map();

  // 先放本地记录
  localRecords.forEach(r => {
    const key = r.store + '||' + r.register_date + '||' + r.tea_name;
    // 本地记录也可能有 source 标记
    if(!r.source) r.source = 'local';
    allMap.set(key, r);
  });

  // 云端记录覆盖同 key 的本地记录（云端更权威）
  cloudRecords.forEach(r => {
    const key = r.store + '||' + r.register_date + '||' + r.tea_name;
    const existing = allMap.get(key);
    // 云端覆盖 local OR 云端日期更新
    if(!existing || existing.source === 'local' ||
       r.register_date >= existing.register_date){
      allMap.set(key, r);
    }
  });

  let allArray = Array.from(allMap.values());

  // 4. 过滤
  if(storeFilter){
    const kw = storeFilter.toLowerCase();
    allArray = allArray.filter(r => r.store && r.store.toLowerCase().includes(kw));
  }

  // 5. 排序：按 register_date 降序
  allArray.sort((a, b) => b.register_date.localeCompare(a.register_date) || (b.id||0) - (a.id||0));

  return { data: allArray, total: allArray.length, cloudCount: cloudRecords.length, localCount: localRecords.length };
}

function getStoreList(){
  const records = loadRecords();
  const stores = new Set();
  records.forEach(r => { if(r.store) stores.add(r.store); });
  return Array.from(stores).sort();
}

// ====== 删除记录 ======
// 云端删除走 FC 队列（sync 每分钟拉取执行），本地删除直接改 localStorage
const LS_DELETES = 'tea_ledger_deletes';
const LS_DELETED_IDS = 'tea_ledger_deleted_ids';

function loadDeletes(){
  try{ return JSON.parse(localStorage.getItem(LS_DELETES) || '[]'); }
  catch(e){ return []; }
}
function saveDeletes(arr){
  try{ localStorage.setItem(LS_DELETES, JSON.stringify(arr)); }catch(e){}
}
// 已提交删除请求的 recordId 集合：用于从查询结果中隐藏，等云端真正删除后自动清除
function loadDeletedIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(LS_DELETED_IDS) || '[]')); }
  catch(e){ return new Set(); }
}
function saveDeletedIds(set){
  try{ localStorage.setItem(LS_DELETED_IDS, JSON.stringify(Array.from(set))); }catch(e){}
}

let _delTarget = null;
function showDeleteModal(r){
  _delTarget = r;
  $("delStore").textContent = r.store || '—';
  $("delDate").textContent = r.register_date || '—';
  $("delTea").textContent = r.tea_name || '—';
  $("delTaster").textContent = r.taster || '—';
  $("delTime").textContent = r.created_at || '—';
  $("delHint").style.display = r.recordId ? "block" : "none";
  $("modalMask").style.display = "flex";
}
function closeDeleteModal(){
  $("modalMask").style.display = "none";
  _delTarget = null;
}
function confirmDeleteRecord(){
  const r = _delTarget;
  if(!r) return;
  closeDeleteModal();
  if(r.recordId){
    requestDeleteRecord(r);
  } else {
    // 本机 localStorage 记录（未同步或网络不通时的本地兜底）
    const records = loadRecords().filter(x =>
      !(x.id === r.id && x.store === r.store &&
        x.register_date === r.register_date && x.tea_name === r.tea_name)
    );
    saveRecords(records);
    toast("本地记录已删除", "ok");
    doQuery();
  }
}

async function requestDeleteRecord(r){
  let queued = false;
  try{
    const resp = await fetch(TUNNEL_URL + '/teatest/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Auth-Token': AUTH_TOKEN},
      body: JSON.stringify({ recordId: r.recordId })
    });
    queued = resp.ok;
  }catch(e){ queued = false; }

  // 无论是否入队成功，都标记为"已删"，先从查询结果隐藏
  const ids = loadDeletedIds();
  ids.add(r.recordId);
  saveDeletedIds(ids);

  if(queued){
    toast("删除请求已提交，约 1-2 分钟云端同步生效", "ok");
  } else {
    // 网络不通：暂存待删队列，联网后自动重试
    const dels = loadDeletes();
    if(!dels.some(d => d.recordId === r.recordId)){
      dels.push({ recordId: r.recordId, store: r.store, tea_name: r.tea_name, created_at: r.created_at, ts: Date.now() });
      saveDeletes(dels);
    }
    toast("网络不通，删除请求已暂存本机，联网后自动重试", "warn");
  }
  doQuery();
}

// 重试未成功提交的删除请求（页面加载 / 切到查询时调用）
async function retryDeletes(){
  const dels = loadDeletes();
  if(!dels.length) return;
  const done = [];
  for(const d of dels){
    try{
      const resp = await fetch(TUNNEL_URL + '/teatest/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Auth-Token': AUTH_TOKEN},
        body: JSON.stringify({ recordId: d.recordId })
      });
      if(resp.ok) done.push(d.recordId);
    }catch(e){}
  }
  if(done.length){
    saveDeletes(dels.filter(d => !done.includes(d.recordId)));
  }
}

// 云端数据已真正删除该记录后，清除本机"已删"标记
function cleanupDeletedIds(){
  const ids = loadDeletedIds();
  if(!ids.size) return;
  const cloudIds = new Set((window.TEATEST_CLOUD_DATA || []).map(r => r.recordId).filter(Boolean));
  let changed = false;
  ids.forEach(id => { if(!cloudIds.has(id)){ ids.delete(id); changed = true; } });
  if(changed) saveDeletedIds(ids);
}

function toast(msg, type){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (type||"");
  setTimeout(()=> t.className = "toast " + (type||""), 2200);
}

// 提交登记
$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const store = $("f_store").value.trim();
  const register_date = $("f_date").value;
  const taster = $("f_taster").value.trim();
  const items = collectItems();
  if(!store || !register_date){
    toast("门店、登记日期为必填项", "err"); return;
  }
  if(!items.length){
    toast("请至少添加一种茶叶", "err"); return;
  }
  const blanks = items.filter(it => !it.tea_name.trim());
  if(blanks.length){
    toast("请填写所有茶叶名称", "err"); return;
  }
  // 同表单内去重：相同茶叶名称只留一条（防止一次登记重复添加）
  const seen = new Set(), dedupedItems = [];
  items.forEach(it => {
    const key = it.tea_name.trim();
    if(!seen.has(key)){ seen.add(key); dedupedItems.push(it); }
  });
  try{
    const { records: newRecords, cloudOk } = await insertRecords({
      store, register_date, taster
    }, dedupedItems);
    if(cloudOk){
      toast(`登记成功！数据约 1-2 分钟同步到云端，本机已可立即查询`, "ok");
    } else {
      toast(`网络不通，已暂存本机 ${newRecords.length} 条，联网后自动重传`, "warn");
    }
    // 自动跳到查询台账看新记录
    setTimeout(() => switchTab('query'), 600);
    onFormReset(true);
    doQuery();
  }catch(e){ toast("网络错误，无法连接服务", "err"); }
});

function calcWarnStatus(registerDate){
  // 试闻30天更换，提前3天预警（第27天起）
  const reg = new Date(registerDate + 'T00:00:00');
  const now = new Date();
  const diffMs = now - reg;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if(diffDays >= 30){
    return { text: '已过期（'+ diffDays +'天）', cls: 'expired-tag', days: diffDays };
  }
  if(diffDays >= 27){
    const remain = 30 - diffDays;
    return { text: '预警（剩'+ remain +'天）', cls: 'warn-tag', days: diffDays };
  }
  return { text: '正常（'+ diffDays +'天）', cls: 'status-tag', days: diffDays };
}

function doQuery(){
  const storeFilter = $("q_store").value.trim();
  const { data: rows, total, cloudCount, localCount } = queryRecords(storeFilter);

  // 显示/隐藏 同步本地记录 按钮
  const pendingCount = loadRecords().filter(r => r.pending).length;
  const syncBtn = $("btnSyncLocal");
  if(syncBtn){
    syncBtn.style.display = pendingCount > 0 ? "inline-block" : "none";
    if(pendingCount > 0) syncBtn.textContent = `同步本地记录 (${pendingCount})`;
  }

  const bar = $("countBar");
  if(rows.length){
    bar.style.display = "block";
    let sourceInfo = "";
    if(cloudCount > 0 && localCount > 0){
      sourceInfo = " <span style=\"font-size:12px;color:var(--tea-gold);\">云" + cloudCount + "条 + 本地" + localCount + "条 · 已去重</span>";
    } else if(cloudCount > 0){
      sourceInfo = " <span style=\"font-size:12px;color:var(--tea-gold);\">来源：云端同步</span>";
    } else {
      sourceInfo = " <span style=\"font-size:12px;color:var(--muted);\">来源：本机记录（云端数据暂未同步）</span>";
    }
    if(window.TEATEST_DATA_TIME){
      sourceInfo += " <span style=\"font-size:12px;color:var(--muted);\">云端更新于 " + window.TEATEST_DATA_TIME + "</span>";
    }
    bar.innerHTML = "共 <b>" + rows.length + "</b> 条最新记录" + sourceInfo;
  }else{
    bar.style.display = "block";
    let delayHint = "";
    if(window.TEATEST_DATA_TIME){
      delayHint = " <span style=\"font-size:12px;color:var(--muted);\">（云端数据更新于 " + window.TEATEST_DATA_TIME + "，刚登记约 1-2 分钟后可见）</span>";
    }
    bar.innerHTML = "未查询到符合条件的记录" +
      (cloudCount > 0 ? " <span style=\"font-size:12px;color:var(--muted);\">（云端数据可能有延迟，稍后再试）</span>" : "") + delayHint;
  }
  const tb = $("tbody");
  const cards = $("resultCards");
  tb.innerHTML = "";
  cards.innerHTML = "";
  if(!rows.length){
    tb.innerHTML = '<tr><td colspan="7" class="empty">没有匹配的记录</td></tr>';
    cards.innerHTML = '<div class="empty-card">没有匹配的记录</div>';
    return;
  }
  rows.forEach(r=>{
    // 桌面端：表格行
    const tr = document.createElement("tr");
    const ws = calcWarnStatus(r.register_date);
    const displayId = r.recordId ? ('☁ ' + r.recordId.slice(0, 8)) : (r.id || '—');
    const delBtn = document.createElement("button");
    delBtn.className = "btn-del";
    delBtn.textContent = "删除";
    delBtn.onclick = () => showDeleteModal(r);
    tr.innerHTML = [
      displayId, esc(r.store), esc(r.register_date), esc(r.tea_name),
      esc(r.taster)||"—",
      '<span class="' + ws.cls + '">' + ws.text + '</span>', esc(r.created_at)
    ].map(c=>"<td>"+c+"</td>").join("") + '<td class="td-del"></td>';
    tr.querySelector(".td-del").appendChild(delBtn);
    tb.appendChild(tr);
  });

  // 移动端：门店分组折叠卡片
  const byStore = {};
  rows.forEach(r => {
    const key = r.store || '未知门店';
    if(!byStore[key]) byStore[key] = [];
    byStore[key].push(r);
  });
  Object.keys(byStore).forEach(storeName => {
    const teaList = byStore[storeName];
    teaList.sort((a,b) => b.register_date.localeCompare(a.register_date) || (b.id||0) - (a.id||0));
    const latest = teaList[0];
    const card = document.createElement("div");
    card.className = "store-card";
    card.dataset.store = esc(storeName);

    const header = document.createElement("div");
    header.className = "store-header";
    header.innerHTML = `
      <div class="store-icon">🏪</div>
      <div class="store-info">
        <div class="store-name">${esc(storeName)}</div>
        <div class="store-meta">${teaList.length} 种茶叶 · 最近登记 ${esc(latest.register_date)}</div>
      </div>
      <div class="store-arrow">▼</div>
    `;
    header.onclick = function(){ toggleStoreCard(card); };
    card.appendChild(header);

    const divider = document.createElement("div");
    divider.className = "store-divider";
    card.appendChild(divider);

    const listWrap = document.createElement("div");
    listWrap.className = "tea-list";
    teaList.forEach(r => {
      const item = document.createElement("div");
      item.className = "tea-item";
      const ws = calcWarnStatus(r.register_date);
      const displayId = r.recordId ? ('☁ ' + r.recordId.slice(0, 8)) : (r.id || '—');
      item.innerHTML = `
        <div class="tea-item-head">
          <span class="tea-item-name">${esc(r.tea_name)}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="tea-item-date">${esc(r.register_date)}</span>
            <button class="btn-del" type="button">删除</button>
          </span>
        </div>
        <div class="tea-item-row"><span class="${ws.cls}">${ws.text}</span></div>
        <div class="tea-item-row"><span class="tea-item-label">登记人</span><span class="tea-item-val">${esc(r.taster)||"—"}</span></div>
        <div class="tea-item-meta"><span>#${displayId}</span><span>${esc(r.created_at)}</span></div>
      `;
      item.querySelector(".btn-del").onclick = () => showDeleteModal(r);
      listWrap.appendChild(item);
    });
    card.appendChild(listWrap);
    cards.appendChild(card);
  });
}

function exportCsv(){
  const storeFilter = $("q_store").value.trim();
  const { data: rows } = queryRecords(storeFilter);
  // 导出时显示全量历史��不去重）
  const allRecords = loadRecords().filter(r => {
    if(!storeFilter) return true;
    return r.store && r.store.toLowerCase().includes(storeFilter.toLowerCase());
  });
  const headers = ["ID","门店","登记日期","茶叶名称","登记人","录入时间"];
  const lines = [headers.join(",")];
  allRecords.forEach(r => {
    lines.push([
      r.id,
      '"'+(r.store||"").replace(/"/g,'""')+'"',
      r.register_date,
      '"'+(r.tea_name||"").replace(/"/g,'""')+'"',
      '"'+(r.taster||"").replace(/"/g,'""')+'"',
      r.created_at
    ].join(","));
  });
  const bom = '\uFEFF';
  const blob = new Blob([bom + lines.join("\n")], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '茶叶试闻台账_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 ' + allRecords.length + ' 条记录', 'ok');
}

async function manualSyncLocal(){
  const btn = $("btnSyncLocal");
  if(!btn) return;
  btn.disabled = true;
  btn.textContent = "同步中...";
  try{
    const res = await syncLocalRecords();
    if(res.uploaded > 0){
      toast(`已补传 ${res.uploaded} 条本地记录`, 'ok');
    } else if(res.failed > 0){
      toast(`网络仍不通，${res.failed} 条未同步`, 'warn');
    } else {
      toast('没有待同步的本地记录', 'ok');
    }
    doQuery();
  }catch(e){
    toast('同步失败，请检查网络', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = "同步本地记录";
  }
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function statusTag(v){
  if(!v) return "—";
  const map = {正常:'<span class="status-tag" style="background:#e8f5e9;color:#2e7d32">正常</span>',
    偏陈:'<span class="status-tag" style="background:#fff3e0;color:#ef6c00">偏陈</span>',
    受潮:'<span class="status-tag" style="background:#e3f2fd;color:#1565c0">受潮</span>',
    异味:'<span class="status-tag" style="background:#fce4ec;color:#c62828">异味</span>',
    其他异常:'<span class="status-tag" style="background:#f3e5f5;color:#6a1b9a">其他异常</span>'};
  return map[v] || esc(v);
}

// ---------- 可搜索下拉（茶叶名称 / 登记人） ----------
// 全局缓存：茶叶列表 + 钉钉组织
let TEA_OPTIONS = [];
let ORG_OPTIONS = [];

function makeCombobox(input, listEl, options){
  function render(){
    const f = input.value.trim().toLowerCase();
    const matched = options.filter(o =>
      !f || o.label.toLowerCase().includes(f) ||
      (o.hint && o.hint.toLowerCase().includes(f))
    );
    listEl.innerHTML = "";
    if(!matched.length){
      const li = document.createElement("li");
      li.className = "combo-empty";
      li.textContent = "无匹配，可直接输入";
      listEl.appendChild(li);
      listEl.style.display = "block";
      return;
    }
    matched.slice(0,50).forEach(o=>{
      const li = document.createElement("li");
      const nm = document.createElement("span");
      nm.className = "combo-name"; nm.textContent = o.label;
      li.appendChild(nm);
      if(o.hint){
        const ht = document.createElement("span");
        ht.className = "combo-hint"; ht.textContent = o.hint;
        li.appendChild(ht);
      }
      li.addEventListener("mousedown", e=>{
        e.preventDefault();
        input.value = o.label;
        listEl.style.display = "none";
      });
      listEl.appendChild(li);
    });
    listEl.style.display = "block";
  }
  input.addEventListener("input", render);
  input.addEventListener("focus", render);
  input.addEventListener("blur", ()=> setTimeout(()=> listEl.style.display="none", 150));
}

async function loadComboboxData(){
  try{
    // 门店：合并 stores.json（763家预置清单）+ localStorage 已有记录 + 测试门店
    const builtinStores = await fetch("stores.json")
      .then(r=>r.json())
      .then(arr => (arr||[]).map(x => typeof x === "string" ? {label:x} : x))
      .catch(()=>[]);
    // 测试门店（演示用，硬编码到前端，不依赖 stores.json 部署生效）
    const TEST_STORES = [
      {label: "🧪 测试门店A（演示用）"},
      {label: "🧪 测试门店B（演示用）"},
      {label: "🧪 Test Store Demo"},
    ];
    const localStores = getStoreList().map(s => ({label: s}));
    // 合并去重（测试门店置顶）
    const storeMap = new Map();
    TEST_STORES.forEach(s => storeMap.set(s.label, s));
    builtinStores.forEach(s => storeMap.set(s.label, s));
    localStores.forEach(s => { if(!storeMap.has(s.label)) storeMap.set(s.label, s); });
    const storeData = Array.from(storeMap.values());
    // 登记人：从 org.json 加载
    const orgData = await fetch("org.json")
      .then(r=>r.json())
      .then(arr => (arr||[]).map(x => typeof x === "string" ? {label:x} : x))
      .catch(()=>[]);
    ORG_OPTIONS = orgData;
    makeCombobox($("f_store"), $("list_store"), storeData);
    makeCombobox($("f_taster"), $("list_taster"), ORG_OPTIONS);
    renderItems();
  }catch(e){ renderItems(); }
}

// ---------- 茶叶条目（多茶批量登记） ----------
const MAX_ITEMS = 10; // 单次最多 10 种
let items = []; // [{id, value}]

function addItem(value = ""){
  if(items.length >= MAX_ITEMS){
    toast(`最多添加 ${MAX_ITEMS} 种茶叶`, "err");
    return;
  }
  items.push({ id: Date.now() + Math.random(), value });
  renderItems();
}

function removeItem(id){
  if(items.length <= 1){
    toast("至少保留一种茶叶", "err");
    return;
  }
  items = items.filter(it => it.id !== id);
  renderItems();
}

// ====== 茶叶名称列表（从钉钉SKU表同步） ======
let TEA_LIST = [];
async function loadTeaList(){
  try{
    const resp = await fetch("tea_list.json?v=" + Date.now());
    if(resp.ok){
      TEA_LIST = await resp.json();
      console.log("茶叶名称列表已加载:", TEA_LIST.length, "种");
    }
  }catch(e){ console.warn("茶叶名称列表加载失败，将使用自由输入模式:", e.message); }
}

function renderItems(showSuggestions){
  const list = $("itemList");
  list.innerHTML = "";
  const datalistId = "tea-suggestions";
  let hadDatalist = !!document.getElementById(datalistId);
  items.forEach((it, idx) => {
    const row = document.createElement("div");
    row.className = "item-row";
    row.dataset.id = it.id;
    row.innerHTML = `
      <span class="item-idx">${idx + 1}</span>
      <div class="tea-input">
        <input type="text" placeholder="填写茶叶名称（可搜索，必填）" value="${esc(it.value)}" autocomplete="off" list="${datalistId}">
      </div>
      <button type="button" class="item-del" title="删除该条">×</button>
    `;
    const input = row.querySelector("input");
    const delBtn = row.querySelector(".item-del");
    input.addEventListener("input", () => {
      it.value = input.value;
    });
    delBtn.addEventListener("click", () => removeItem(it.id));
    list.appendChild(row);
  });
  // 如果TEA_LIST有数据且还没创建datalist，填充一次
  if(TEA_LIST.length && !hadDatalist){
    const dl = document.createElement("datalist");
    dl.id = datalistId;
    dl.innerHTML = TEA_LIST.map(n => `<option value="${esc(n)}">`).join("");
    list.appendChild(dl);
  }
  $("itemCountTag").textContent = `已添加 ${items.length} 种`;
}

function collectItems(){
  return items.map(it => ({ tea_name: it.value.trim() }));
}

function onFormReset(keepCommon = false){
  items = [{ id: Date.now() + Math.random(), value: "" }];
  renderItems();
  if(!keepCommon){
    $("form").reset();
    $("f_date").value = new Date().toISOString().slice(0,10);
  }else{
    // 保留门店/日期/登记人，仅清空茶叶条目
  }
}

items = [{ id: Date.now() + Math.random(), value: "" }];
renderItems();

$("form").addEventListener("reset", e => {

});
